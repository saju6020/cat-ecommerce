<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Walk-in customer — US-ACC-10</title>

</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:wght@600&family=Public+Sans:ital,wght@0,400;0,600;0,700&display=swap">
<style>
:root{--surface-page:#faf9f6;--surface:#fff;--surface-sunken:#f2efe7;--ink:#1c1a17;--ink-muted:#5c574f;--border:#e5e1d8;--border-strong:#cbc3b2;--accent:#15605a;--accent-ink:#0e4a45;--warning-bg:#fbf0dc;--warning-ink:#6e4700;--font-display:"Newsreader",Georgia,serif;--font-sans:"Public Sans",system-ui,sans-serif;--radius-sm:6px;--radius-md:10px}
*{box-sizing:border-box}
body{margin:0;font-family:var(--font-sans);background:var(--surface-page);color:var(--ink)}
.topnav{display:flex;align-items:center;justify-content:space-between;padding:14px 32px;border-bottom:1px solid var(--border);background:#fff}
.brand{font-family:var(--font-display);font-weight:600;font-size:18px;color:var(--accent-ink)}
.who{font-size:13.5px}
.h1{font-family:var(--font-display);font-weight:600;font-size:22px;margin:0 0 18px}
.muted{color:var(--ink-muted)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:24px;max-width:900px}
.card{background:#fff;border:1px solid var(--border);border-radius:var(--radius-md);padding:22px}
.field{margin-bottom:16px}
.field label{display:block;font-size:13px;font-weight:600;margin-bottom:6px}
.field input{width:100%;font:inherit;font-size:15px;padding:9px 12px;border:1px solid var(--border);border-radius:var(--radius-sm)}
.btn{font-family:var(--font-sans);font-weight:600;font-size:14px;padding:10px 18px;border-radius:var(--radius-sm);border:none;cursor:pointer;min-height:40px;background:var(--accent);color:#fff}
.notice{background:var(--warning-bg);color:var(--warning-ink);border-radius:var(--radius-sm);padding:16px;font-size:13.5px;line-height:1.5}
.notice a{color:var(--warning-ink);font-weight:700}
</style>
</helmet>
<div style="width:1280px;height:820px;background:var(--surface-page);overflow:auto">
  <div class="topnav"><div class="brand">PurrCare · staff</div><div class="who">Shormi Akter · Reception</div></div>
  <div style="padding:28px 32px">
    <h1 class="h1">Register a walk-in customer</h1>
    <div class="grid">
      <div class="card">
        <div class="field"><label for="wi-name">Full name</label><input id="wi-name" value="Kamrul Hasan"></div>
        <div class="field"><label for="wi-mobile">Mobile number</label><input id="wi-mobile" value="01712 900112"></div>
        <button type="button" class="btn">Register customer</button>
        <p class="muted" style="font-size:12.5px;margin:12px 0 0">Values stay in the form if this mobile number is already registered — see the notice on the right.</p>
      </div>
      <div class="notice" role="alert">
        <strong>This mobile number is already registered.</strong>
        <p style="margin:8px 0 0">Kamrul Hasan — customer since Mar 2026, 2 cats on file.<br><a href="CustomerDetail.dc.html">View this record →</a></p>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":820}}'>
class Component extends DCLogic { renderVals(){ return {}; } }
</script>
</body>
</html>
