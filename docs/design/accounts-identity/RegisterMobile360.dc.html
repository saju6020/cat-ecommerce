<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Register at 360px — UI-1</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:wght@600&family=Public+Sans:ital,wght@0,400;0,600;0,700&display=swap">
<style>
:root{--surface-page:#faf9f6;--surface:#fff;--surface-sunken:#f2efe7;--ink:#1c1a17;--ink-muted:#5c574f;--border:#e5e1d8;--border-strong:#cbc3b2;--accent:#15605a;--accent-ink:#0e4a45;--focus-ring:#15605a;--font-display:"Newsreader",Georgia,serif;--font-sans:"Public Sans",system-ui,sans-serif;--radius-sm:6px}
*{box-sizing:border-box}
body{margin:0;font-family:var(--font-sans);background:var(--surface-page);color:var(--ink)}
.h1{font-family:var(--font-display);font-weight:600;font-size:21px;margin:0 0 16px}
.banner-notice{display:flex;gap:7px;background:var(--surface-sunken);border-radius:8px;padding:9px 10px;font-size:12.5px;color:var(--ink-muted);margin-bottom:16px;line-height:1.4}
.field{margin-bottom:14px}
.field label{display:block;font-size:12.5px;font-weight:600;margin-bottom:5px}
.field input{width:100%;font:inherit;font-size:16px;padding:10px 11px;border:1px solid var(--border);border-radius:var(--radius-sm)}
.field input:focus{outline:2px solid var(--focus-ring);outline-offset:1px;border-color:var(--accent)}
.hint{font-size:11.5px;color:var(--ink-muted);margin-top:4px}
.captcha-img{width:100%;height:56px;border-radius:6px;background:repeating-linear-gradient(115deg,#dcd6c6 0 6px,#e9e4d6 6px 14px);display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-size:22px;letter-spacing:5px;color:#3a352c;font-weight:600;border:1px solid var(--border-strong);margin-bottom:8px}
.btn{font-family:var(--font-sans);font-weight:600;font-size:15px;padding:12px 16px;border-radius:8px;border:none;background:var(--accent);color:#fff;width:100%;min-height:44px}
</style>
</helmet>
<div style="width:360px;height:820px;background:var(--surface-page);padding:20px 16px;overflow:auto">
  <div style="font-size:11.5px;color:var(--ink-muted);margin-bottom:4px">PurrCare</div>
  <h1 class="h1" tabindex="-1">Create your account</h1>
  <div class="banner-notice"><span aria-hidden="true">ⓘ</span><span>Give a mobile number, an email, or both — you'll use one to sign in.</span></div>
  <div class="field"><label>Full name</label><input value="Farhana Yasmin"></div>
  <div class="field"><label>Mobile number (optional)</label><input placeholder="01712 345678"><div class="hint">Bangladesh mobile, e.g. 01712 345678</div></div>
  <div class="field"><label>Email (optional)</label><input placeholder="you@example.com"></div>
  <div class="field"><label>Password</label><input type="password"><div class="hint">At least 10 characters.</div></div>
  <div class="field">
    <label>Security check</label>
    <div class="captcha-img" role="img" aria-label="Security check: an image of 5 letters and numbers">7QXA2</div>
    <input placeholder="Type the letters and numbers">
  </div>
  <button type="button" class="btn">Create account</button>
  <p style="text-align:center;font-size:11.5px;color:var(--ink-muted);margin-top:24px">No horizontal scroll at 360px — the floor UI-1 sets.</p>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":360,"height":820}}'>
class Component extends DCLogic { renderVals(){ return {}; } }
</script>
</body>
</html>
