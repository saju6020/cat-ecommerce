<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Staff sign-in — US-ACC-14</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:wght@600&family=Public+Sans:ital,wght@0,400;0,600;0,700&display=swap">
<style>
:root{--surface-page:#f2efe7;--surface:#fff;--ink:#1c1a17;--ink-muted:#5c574f;--border:#e5e1d8;--accent:#15605a;--accent-ink:#0e4a45;--focus-ring:#15605a;--font-display:"Newsreader",Georgia,serif;--font-sans:"Public Sans",system-ui,sans-serif;--radius-sm:6px;--radius-md:10px}
*{box-sizing:border-box}
body{margin:0;font-family:var(--font-sans);background:var(--surface-page);color:var(--ink)}
.h1{font-family:var(--font-display);font-weight:600;font-size:24px;margin:0 0 20px}
.muted{color:var(--ink-muted)}
.small{font-size:13px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md)}
.field{margin-bottom:16px}
.field label{display:block;font-size:13px;font-weight:600;margin-bottom:6px}
.field input{width:100%;font:inherit;font-size:15px;padding:9px 12px;border:1px solid var(--border);border-radius:var(--radius-sm)}
.field input:focus{outline:2px solid var(--focus-ring);outline-offset:1px;border-color:var(--accent)}
.btn{font-family:var(--font-sans);font-weight:600;font-size:14px;padding:10px 16px;border-radius:var(--radius-sm);border:none;cursor:pointer;min-height:40px;background:var(--accent);color:#fff;width:100%}
.tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:#fff;background:#3a352c;padding:3px 9px;border-radius:4px;margin-bottom:16px}
</style>
</helmet>
<div style="width:1280px;height:760px;background:var(--surface-page);display:flex;justify-content:center;align-items:center">
  <div class="card" style="width:400px;padding:40px">
    <span class="tag">Staff</span>
    <h1 class="h1" tabindex="-1">Sign in to PurrCare</h1>
    <div class="field">
      <label for="ss-id">Mobile number or email</label>
      <input id="ss-id" type="text" autocomplete="username" value="reception@purrcare.example">
    </div>
    <div class="field">
      <label for="ss-pass">Password</label>
      <input id="ss-pass" type="password" autocomplete="current-password">
    </div>
    <button type="button" class="btn">Sign in</button>
    <div class="small" style="margin-top:16px;text-align:center">
      <a href="#" style="color:var(--accent-ink);font-weight:600">Set or reset password</a>
    </div>
    <p class="small muted" style="margin-top:14px;line-height:1.4">New here? Ask an administrator to create your account, then use "Set or reset password" to choose your first password.</p>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":760}}'>
class Component extends DCLogic { renderVals(){ return {}; } }
</script>
</body>
</html>
