<style>
:root{--surface-page:#faf9f6;--surface:#fff;--surface-sunken:#f2efe7;--ink:#1c1a17;--ink-muted:#5c574f;--border:#e5e1d8;--border-strong:#cbc3b2;--accent:#15605a;--accent-ink:#0e4a45;--accent-soft:rgba(21,96,90,.08);--font-display:"Newsreader",Georgia,serif;--font-sans:"Public Sans",system-ui,sans-serif;--radius-sm:6px;--radius-md:10px;--radius-pill:999px}
*{box-sizing:border-box}
body{margin:0;font-family:var(--font-sans);background:var(--surface-page);color:var(--ink)}
.topnav{display:flex;align-items:center;justify-content:space-between;padding:12px 28px;border-bottom:1px solid var(--border);background:#fff}
.brand{font-family:var(--font-display);font-weight:600;font-size:17px;color:var(--accent-ink)}
.who{font-size:13px}
.main{padding:26px 32px;max-width:640px}
.h1{font-family:var(--font-display);font-weight:600;font-size:21px;margin:0 0 4px}
.muted{color:var(--ink-muted)}
.h2{font-weight:700;font-size:14px;margin:22px 0 10px;display:flex;align-items:center;gap:8px}
.badge{display:inline-flex;padding:3px 9px;border-radius:var(--radius-pill);font-size:11px;font-weight:600;background:var(--accent-soft);color:var(--accent-ink)}
.dayrow{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border);font-size:13.5px}
.dayname{width:90px;font-weight:600}
.slot{background:var(--surface-sunken);border-radius:6px;padding:5px 9px;font-size:12.5px}
.field{margin:12px 0;max-width:260px}
.field label{display:block;font-size:12.5px;font-weight:600;margin-bottom:5px}
.field input{width:100%;font:inherit;font-size:13.5px;padding:7px 10px;border:1px solid var(--border);border-radius:6px}
.btn{font-family:var(--font-sans);font-weight:600;font-size:13.5px;padding:8px 14px;border-radius:6px;border:none;cursor:pointer;background:var(--accent);color:#fff;margin-right:8px}
.btn-outline{background:#fff;border:1px solid var(--border-strong);color:var(--ink)}
</style>
</helmet>
<div style="width:1280px;height:820px;background:var(--surface-page);overflow:auto">
  <div class="topnav"><div class="brand">PurrCare · staff</div><div class="who">Rezwan Ahmed · Administrator</div></div>
  <div class="main">
    <h1 class="h1">Tanvir Islam — roster pattern</h1>
    <p class="muted">Nurse · Uttara</p>

    <div class="h2">Current pattern</div>
    <div class="dayrow"><div class="dayname">Mon–Fri</div><div class="slot">10:00–18:00 · Consult 1</div></div>
    <div class="dayrow"><div class="dayname">Sat, Sun</div><div class="slot" style="background:none;color:var(--ink-muted)">Off</div></div>

    <div class="h2">Scheduled next <span class="badge">Scheduled</span></div>
    <div class="dayrow"><div class="dayname">Mon–Thu</div><div class="slot">09:00–17:00 · Consult 1</div></div>
    <div class="dayrow"><div class="dayname">Fri</div><div class="slot">09:00–13:00 · Consult 1</div></div>
    <div class="dayrow"><div class="dayname">Sat, Sun</div><div class="slot" style="background:none;color:var(--ink-muted)">Off</div></div>
    <div class="field"><label>Effective from</label><input value="6 Oct 2026"></div>
    <button type="button" class="btn btn-outline">Cancel scheduled pattern</button>

    <div class="h2" style="margin-top:30px">Edit pattern</div>
    <button type="button" class="btn">Apply now</button>
    <button type="button" class="btn btn-outline">Schedule as next pattern from a date</button>
  </div>
</div>
</x-dc>
