# HO-XCT-001 section 16.2 -- a disposable PostgreSQL 17 + pgBackRest for the backup drill (run-drill-test.sh). NOT for production.
# Every secret is read from the environment of the process that runs the drill (run-drill-test.sh generates throw-away values); nothing is committed.
#
# repo1 is a posix volume. repo2 stands in for the off-site repository: encrypted with the same cipher settings as production, but posix, because no
# S3-compatible server image could be pulled in the build environment. The S3 transport itself is therefore NOT exercised by this drill (see the runbook, OQ-9).
name: purrcare-drill

services:
  pg:
    image: purrcare-backup:dev
    container_name: purrcare-drill-pg
    entrypoint: ["bash", "/drill/entrypoint-drill.sh"]
    command: ["postgres"]
    environment:
      POSTGRES_PASSWORD: ${DRILL_PG_PASSWORD:?set by run-drill-test.sh}
      POSTGRES_DB: catecommerce
      PGPORT: "5432"
      REPO2_CIPHER_PASS: ${DRILL_CIPHER_PASS:?set by run-drill-test.sh}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - repo1:/var/lib/pgbackrest
      - ./:/drill:ro
      - ./initdb:/docker-entrypoint-initdb.d:ro
    shm_size: 128mb

volumes:
  pgdata:
  repo1:
