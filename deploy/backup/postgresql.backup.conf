# HO-XCT-001 section 12.8 -- WAL archiving for point-in-time recovery.
# Include from postgresql.conf:  include = '/etc/postgresql/postgresql.backup.conf'
wal_level = replica
archive_mode = on
archive_command = 'pgbackrest --stanza=purrcare archive-push %p'
# A WAL segment is switched and shipped at least every 60 seconds even on a quiet database: this, not the nightly backup, bounds data loss (RPO 15 min).
archive_timeout = 60
max_wal_senders = 3
